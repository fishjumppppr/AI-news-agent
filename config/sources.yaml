sources:
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    type: rss
    weight: 5

  - name: Anthropic News
    url: https://www.anthropic.com/news
    type: html
    weight: 5

  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    type: rss
    weight: 5

  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    type: rss
    weight: 4

  - name: Microsoft Azure Blog
    url: https://azure.microsoft.com/en-us/blog/feed/
    type: rss
    weight: 4

  - name: Meta AI Blog
    url: https://ai.meta.com/blog/
    type: html
    weight: 4

  - name: NVIDIA Blog - AI
    url: https://blogs.nvidia.com/blog/category/deep-learning/feed/
    type: rss
    weight: 3

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    type: rss
    weight: 4

  - name: arXiv cs.AI
    url: https://export.arxiv.org/rss/cs.AI
    type: rss
    weight: 3

  - name: arXiv cs.CL
    url: https://export.arxiv.org/rss/cs.CL
    type: rss
    weight: 3

  - name: GitHub Trending Python
    url: https://github.com/trending/python?since=daily
    type: html
    weight: 2

  - name: Google News - AI Agents
    url: https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en
    type: google_news_rss
    query: '(AI agent OR autonomous agent OR coding agent OR MCP OR "tool use") when:1d'
    weight: 3
    limit: 25

  - name: GDELT - AI Agents
    url: https://api.gdeltproject.org/api/v2/doc/doc
    type: gdelt
    query: '"AI agent" OR "coding agent" OR "autonomous agent" OR "multi-agent" OR "MCP"'
    weight: 2
    limit: 25

  - name: Hacker News - AI Agents
    url: https://hn.algolia.com/api/v1/search_by_date
    type: hackernews
    query: 'AI agent OR coding agent OR MCP OR LLM'
    weight: 2
    limit: 20

  - name: GitHub Search - Agent Projects
    url: https://api.github.com/search/repositories
    type: github_search
    query: 'agent llm language:Python stars:>20'
    weight: 2
    limit: 20
